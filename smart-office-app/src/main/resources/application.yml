server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/smart_office?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6380
      password: 123456
  redis:
    host: localhost
    port: 6380
    password: 123456
  rabbitmq:
    host: localhost
    port: 5673
    username: admin
    password: 123456
    virtual-host: /

jwt:
  secret: smart-office-jwt-secret-key-2026-please-change-in-production-32bytes-min
  expiration: 86400000

mqtt:
  broker: tcp://localhost:1884
  client-id: smart-office-backend-local       # ★ 本地加 -local 后缀
  username: ""
  password: ""
  qos: 1
  topic: factory/device/+/telemetry
  clean-session: false                        # ★ 新增

tdengine:
  url: jdbc:TAOS-RS://localhost:6041/smart_office
  username: root
  password: taosdata

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.smart_office.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO

# ★ AI 层配置（推荐用环境变量注入）
ai:
  llm:
    provider: ${AI_LLM_PROVIDER:mock}         # 默认 mock，环境变量覆盖为 deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}           # 从环境变量读，不硬编码
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}