#  监控抓取配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alert.yml

scrape_configs:
  - job_name: 'smart-office'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['smart-office:8080']
        labels:
          application: 'smart-office'